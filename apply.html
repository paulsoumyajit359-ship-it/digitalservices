<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Service | Digital Service</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033;line-height:1.6}
.header{background:linear-gradient(135deg,#063b8f,#1769d1);color:#fff;padding:18px 6%;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 12px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;background:#fff;color:#0755b8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
.brand h1{font-size:23px}.brand p{font-size:13px;opacity:.9}.home-btn{color:#fff;text-decoration:none;font-weight:700}
.container{max-width:850px;margin:45px auto;padding:0 20px}.card{background:#fff;border-radius:16px;padding:35px;box-shadow:0 8px 30px rgba(20,40,80,.1)}
h2{text-align:center;color:#063b8f;margin-bottom:8px}.subtitle{text-align:center;color:#687386;margin-bottom:30px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.group{margin-bottom:18px}.full{grid-column:1/-1}
label{display:block;font-weight:700;margin-bottom:7px;color:#24324a}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #ccd5e2;border-radius:8px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1769d1;box-shadow:0 0 0 3px rgba(23,105,209,.1)}
.file-box{border:1px dashed #9fb0c8;padding:18px;border-radius:10px;background:#f8fafc}.help{font-size:12px;color:#687386;margin-top:6px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#0866d8;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:hover{background:#064fa8}button:disabled{opacity:.6;cursor:not-allowed}
.message{margin-top:18px;padding:13px;border-radius:8px;display:none}.success{display:block;background:#e8f7ee;color:#16733a}.error{display:block;background:#fdeaea;color:#b42318}
.selected-note{display:none;background:#eef5ff;color:#064fa8;padding:10px 12px;border-radius:8px;margin-bottom:18px;font-weight:600}
@media(max-width:700px){.header{flex-direction:column;gap:12px;text-align:center}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:24px}.container{margin:25px auto}}
</style>
</head>
<body>

<header class="header">
<div class="brand"><div class="logo">DS</div><div><h1>Digital Service</h1><p>Digital • Tax • Business Services</p></div></div>
<a href="index.html" class="home-btn">← Home</a>
</header>

<main class="container">
<div class="card">
<h2>Apply for a Service</h2>
<p class="subtitle">Submit your details and we will process your service request.</p>
<div id="selectedNote" class="selected-note"></div>
<div id="draftStatus" style="display:none;margin-bottom:18px;padding:11px 13px;border-radius:9px;background:#f0f7ff;color:#1455a0;font-size:13px;font-weight:700;"></div>

<form id="applicationForm">
<div class="form-grid">
<div class="group"><label for="customerName">Customer Name *</label><input id="customerName" type="text" required placeholder="Enter your full name"></div>
<div class="group"><label for="mobile">Mobile Number *</label><input id="mobile" type="tel" maxlength="10" inputmode="numeric" required placeholder="10 digit mobile number"></div>
<div class="group"><label for="email">Email Address *</label><input id="email" type="email" required placeholder="Enter your email"></div>
<div class="group"><label for="whatsapp">WhatsApp Number</label><input id="whatsapp" type="tel" maxlength="10" inputmode="numeric" placeholder="WhatsApp number"></div>
<div class="group full"><label for="service">Service *</label>
<select id="service" required>
<option value="">Select a service</option>
<option value="PAN Card">PAN Card</option>
<option value="Aadhaar">Aadhaar Card</option>
<option value="Ration Card">Ration Card</option>
<option value="Trade License">Trade License</option>
<option value="Shop & Establishment">Shop & Establishment</option>
<option value="FSSAI License">FSSAI License</option>
<option value="GST">GST</option>
<option value="TDS">TDS</option>
<option value="Income Tax">Income Tax</option>
<option value="Other Services">Other Services</option>
</select>
</div>
<div class="group full"><label for="address">Address</label><textarea id="address" placeholder="Enter your address"></textarea></div>
<div class="group full"><label for="requirement">Requirement / Details *</label><textarea id="requirement" required placeholder="Tell us what service you need"></textarea></div>
<div class="group full"><label for="document">Upload Document</label><div class="file-box"><input id="document" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"><div class="help">PDF / JPG / PNG / WEBP • Maximum 5 MB</div></div></div>
<div class="group full"><button id="submitButton" type="submit">Submit Application</button><div id="message" class="message"></div></div>
</div>
</form>
</div>
</main>

<script>
const SUPABASE_URL="https://nlzrdjvlkdqungmhnsrl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const STORAGE_BUCKET="documents";

const form=document.getElementById("applicationForm");
const serviceSelect=document.getElementById("service");
const selectedNote=document.getElementById("selectedNote");
const message=document.getElementById("message");
const button=document.getElementById("submitButton");
const draftStatus=document.getElementById("draftStatus");

const serviceAliases={
 "PAN Card":"PAN Card","pan":"PAN Card",
 "Aadhaar":"Aadhaar","aadhaar":"Aadhaar","Aadhaar Card":"Aadhaar",
 "Ration Card":"Ration Card","ration-card":"Ration Card",
 "Trade License":"Trade License","trade-license":"Trade License",
 "Shop & Establishment":"Shop & Establishment",
 "FSSAI License":"FSSAI License","fssai":"FSSAI License",
 "GST":"GST","gst":"GST",
 "TDS":"TDS","tds":"TDS",
 "Income Tax":"Income Tax","income-tax":"Income Tax"
};

let currentUser=null;
let draftApplication=null;
let saveTimer=null;
let saving=false;
let pendingSave=false;

function showMessage(text,type){
    message.textContent=text;
    message.className="message "+type;
}

function getApplicationId(){
    return "DS"+String(Math.floor(10000000+Math.random()*90000000));
}

function safeFileName(name){
    return name.replace(/[^a-zA-Z0-9._-]/g,"_");
}

function getApplicationIdFromUrl(){
    return new URLSearchParams(location.search).get("application_id");
}

function setDraftStatus(text){
    draftStatus.textContent=text;
    draftStatus.style.display="block";
}

function hideDraftStatus(){
    draftStatus.style.display="none";
}

function formData(){
    return {
        customer_name:document.getElementById("customerName").value.trim(),
        mobile:document.getElementById("mobile").value.trim(),
        email:document.getElementById("email").value.trim().toLowerCase(),
        whatsapp:document.getElementById("whatsapp").value.trim(),
        service:serviceSelect.value,
        address:document.getElementById("address").value.trim(),
        requirement:document.getElementById("requirement").value.trim()
    };
}

function hasMeaningfulData(data){
    return Boolean(
        data.customer_name ||
        data.mobile ||
        data.email ||
        data.whatsapp ||
        data.service ||
        data.address ||
        data.requirement
    );
}

function fillForm(app){
    if(!app) return;

    document.getElementById("customerName").value=app.customer_name || "";
    document.getElementById("mobile").value=app.mobile || "";
    document.getElementById("email").value=app.email || "";
    document.getElementById("whatsapp").value=app.whatsapp || "";
    document.getElementById("address").value=app.address || "";
    document.getElementById("requirement").value=app.requirement || "";

    if(app.service){
        serviceSelect.value=app.service;
        selectedNote.textContent="Selected service: "+app.service;
        selectedNote.style.display="block";
    }

    if(app.document_urls && Array.isArray(app.document_urls) && app.document_urls.length){
        const fileBox=document.querySelector(".file-box");
        if(fileBox){
            let existing=document.getElementById("existingDocument");
            if(!existing){
                existing=document.createElement("div");
                existing.id="existingDocument";
                existing.style.cssText="margin-top:10px;padding:10px;background:#eaf8f0;border-radius:8px;color:#08783d;font-size:12px;font-weight:700;";
                fileBox.appendChild(existing);
            }
            existing.textContent="📄 Previously uploaded document is saved. Select a new file only if you want to replace it.";
        }
    }
}

async function loadUser(){
    const {data:{user},error}=await supabaseClient.auth.getUser();

    if(error) throw error;

    if(!user){
        window.location.href="login.html";
        return null;
    }

    currentUser=user;
    return user;
}

async function findExistingDraft(user,applicationId=null,service=null){
    let query=supabaseClient
        .from("applications")
        .select("*")
        .eq("user_id",user.id)
        .eq("status","Draft");

    if(applicationId){
        query=query.eq("application_id",applicationId);
    }else if(service){
        query=query.eq("service",service).order("created_at",{ascending:false}).limit(1);
    }else{
        return null;
    }

    const {data,error}=await query;

    if(error) throw error;

    return data && data.length ? data[0] : null;
}

async function createDraft(data){
    if(!currentUser) return null;

    if(!data.service){
        setDraftStatus("Select a service to start saving your application.");
        return null;
    }

    const existing=await findExistingDraft(currentUser,null,data.service);

    if(existing){
        draftApplication=existing;
        fillForm(existing);
        return existing;
    }

    const applicationId=getApplicationId();

    const {data:created,error}=await supabaseClient
        .from("applications")
        .insert({
            application_id:applicationId,
            customer_name:data.customer_name || null,
            mobile:data.mobile || null,
            email:data.email || currentUser.email || null,
            whatsapp:data.whatsapp || null,
            service:data.service,
            requirement:data.requirement || null,
            address:data.address || null,
            status:"Draft",
            admin_note:null,
            document_urls:[],
            user_id:currentUser.id,
            last_saved_at:new Date().toISOString(),
            submitted_at:null
        })
        .select("*")
        .single();

    if(error) throw error;

    draftApplication=created;

    if(!location.search.includes("application_id=")){
        history.replaceState(
            {},
            "",
            "apply.html?application_id="+encodeURIComponent(applicationId)
        );
    }

    setDraftStatus("💾 Draft saved automatically.");
    return created;
}

async function saveDraft(){
    if(!currentUser) return;
    if(!hasMeaningfulData(formData())) return;

    const data=formData();

    if(!data.service){
        setDraftStatus("Select a service to continue auto-saving.");
        return;
    }

    if(saving){
        pendingSave=true;
        return;
    }

    saving=true;

    try{
        if(!draftApplication){
            await createDraft(data);
        }

        if(!draftApplication) return;

        const fileInput=document.getElementById("document");
        const selectedFile=fileInput && fileInput.files ? fileInput.files[0] : null;

        if(selectedFile){
            if(selectedFile.size > 5*1024*1024){
                setDraftStatus("⚠️ Maximum file size is 5 MB.");
                return;
            }

            const currentDocuments=Array.isArray(draftApplication.document_urls)
                ? draftApplication.document_urls
                : [];

            if(!currentDocuments.length){
                const path=`applications/${draftApplication.application_id}/${Date.now()}_${safeFileName(selectedFile.name)}`;

                const {error:uploadError}=await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .upload(path,selectedFile,{
                        cacheControl:"3600",
                        upsert:false,
                        contentType:selectedFile.type
                    });

                if(uploadError) throw uploadError;

                const {data:documentUpdated,error:documentError}=await supabaseClient
                    .from("applications")
                    .update({
                        document_urls:[path],
                        last_saved_at:new Date().toISOString()
                    })
                    .eq("id",draftApplication.id)
                    .eq("user_id",currentUser.id)
                    .eq("status","Draft")
                    .select("*")
                    .single();

                if(documentError){
                    await supabaseClient.storage
                        .from(STORAGE_BUCKET)
                        .remove([path]);
                    throw documentError;
                }

                draftApplication=documentUpdated;

                setDraftStatus(
                    "📎 Document saved automatically • "+
                    new Date().toLocaleTimeString("en-IN")
                );
            }
        }

        const updateData={
            customer_name:data.customer_name || null,
            mobile:data.mobile || null,
            email:data.email || currentUser.email || null,
            whatsapp:data.whatsapp || null,
            service:data.service,
            requirement:data.requirement || null,
            address:data.address || null,
            last_saved_at:new Date().toISOString()
        };

        const {data:updated,error}=await supabaseClient
            .from("applications")
            .update(updateData)
            .eq("id",draftApplication.id)
            .eq("user_id",currentUser.id)
            .eq("status","Draft")
            .select("*")
            .single();

        if(error) throw error;

        draftApplication=updated;

        setDraftStatus("💾 Saved automatically • "+new Date().toLocaleTimeString("en-IN"));
    }catch(error){
        console.error("Draft save error:",error);
        setDraftStatus("⚠️ Auto-save failed. Your information may not be saved.");
    }finally{
        saving=false;

        if(pendingSave){
            pendingSave=false;
            saveDraft();
        }
    }
}

function scheduleAutoSave(){
    clearTimeout(saveTimer);

    saveTimer=setTimeout(()=>{
        saveDraft();
    },700);
}

async function loadDraftOrDefaults(){
    const user=await loadUser();
    if(!user) return;

    const applicationId=getApplicationIdFromUrl();

    if(applicationId){
        const {data,error}=await supabaseClient
            .from("applications")
            .select("*")
            .eq("application_id",applicationId)
            .eq("user_id",user.id)
            .eq("status","Draft")
            .maybeSingle();

        if(error) throw error;

        if(data){
            draftApplication=data;
            fillForm(data);
            setDraftStatus("📝 Draft loaded • Continue where you left off.");
            return;
        }
    }

    document.getElementById("email").value=user.email || "";
    document.getElementById("customerName").value=
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "";
    document.getElementById("mobile").value=
        user.user_metadata?.mobile || "";

    const raw=new URLSearchParams(location.search).get("service");

    if(raw){
        const value=serviceAliases[raw]||raw;
        const option=[...serviceSelect.options]
            .find(o=>o.value.toLowerCase()===String(value).toLowerCase());

        if(option){
            serviceSelect.value=option.value;
            selectedNote.textContent="Selected service: "+option.textContent;
            selectedNote.style.display="block";

            const existing=await findExistingDraft(user,null,option.value);

            if(existing){
                draftApplication=existing;
                fillForm(existing);
                setDraftStatus("📝 Existing draft loaded • Continue where you left off.");
            }else{
                await createDraft(formData());
            }
        }
    }
}

async function uploadDocument(file){
    if(!file || !draftApplication) return;

    if(file.size>5*1024*1024){
        showMessage("Maximum file size is 5 MB.","error");
        return;
    }

    setDraftStatus("📤 Uploading document...");

    const path=
        "applications/" +
        draftApplication.application_id +
        "/" +
        Date.now() +
        "_" +
        safeFileName(file.name);

    const {error:uploadError}=await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(path,file,{
            cacheControl:"3600",
            upsert:false,
            contentType:file.type
        });

    if(uploadError) throw uploadError;

    const oldDocs=Array.isArray(draftApplication.document_urls)
        ? draftApplication.document_urls
        : [];

    const newDocs=[...oldDocs,path];

    const {data:updated,error:updateError}=await supabaseClient
        .from("applications")
        .update({
            document_urls:newDocs,
            last_saved_at:new Date().toISOString()
        })
        .eq("id",draftApplication.id)
        .eq("user_id",currentUser.id)
        .eq("status","Draft")
        .select("*")
        .single();

    if(updateError){
        await supabaseClient.storage.from(STORAGE_BUCKET).remove([path]);
        throw updateError;
    }

    draftApplication=updated;

    setDraftStatus("💾 Document saved automatically • "+new Date().toLocaleTimeString("en-IN"));

    let existing=document.getElementById("existingDocument");
    if(!existing){
        const fileBox=document.querySelector(".file-box");
        existing=document.createElement("div");
        existing.id="existingDocument";
        existing.style.cssText="margin-top:10px;padding:10px;background:#eaf8f0;border-radius:8px;color:#08783d;font-size:12px;font-weight:700;";
        fileBox.appendChild(existing);
    }

    existing.textContent="📄 Document saved successfully.";
}

async function submitApplication(){
    const data=formData();

    if(!data.customer_name){
        showMessage("Please enter your full name.","error");
        document.getElementById("customerName").focus();
        return;
    }

    if(!/^[0-9]{10}$/.test(data.mobile)){
        showMessage("Please enter a valid 10 digit mobile number.","error");
        document.getElementById("mobile").focus();
        return;
    }

    if(!data.email){
        showMessage("Please enter your email address.","error");
        return;
    }

    if(!data.service){
        showMessage("Please select a service.","error");
        return;
    }

    if(!data.requirement){
        showMessage("Please enter your requirement / details.","error");
        document.getElementById("requirement").focus();
        return;
    }

    if(data.whatsapp && !/^[0-9]{10}$/.test(data.whatsapp)){
        showMessage("Please enter a valid WhatsApp number.","error");
        return;
    }

    button.disabled=true;
    button.textContent="Submitting...";

    try{
        await saveDraft();

        if(!draftApplication){
            throw new Error("Unable to save your application draft.");
        }

        const {data:submitted,error}=await supabaseClient
            .from("applications")
            .update({
                customer_name:data.customer_name,
                mobile:data.mobile,
                email:data.email,
                whatsapp:data.whatsapp || null,
                service:data.service,
                requirement:data.requirement,
                address:data.address || null,
                status:"Pending",
                submitted_at:new Date().toISOString(),
                last_saved_at:new Date().toISOString(),
                status_updated_at:new Date().toISOString()
            })
            .eq("id",draftApplication.id)
            .eq("user_id",currentUser.id)
            .eq("status","Draft")
            .select("*")
            .single();

        if(error) throw error;

        draftApplication=submitted;

        showMessage(
            "Application submitted successfully. Application ID: "+
            submitted.application_id,
            "success"
        );

        setDraftStatus("✅ Application submitted successfully.");

        button.textContent="Application Submitted";
        button.disabled=true;

        setTimeout(()=>{
            window.location.href="customer-dashboard.html";
        },1200);

    }catch(error){
        console.error("Application submission error:",error);
        showMessage(
            "Application submission failed: "+
            (error.message || "Unknown error"),
            "error"
        );
        button.disabled=false;
        button.textContent="Submit Application";
    }
}

form.addEventListener("submit",async e=>{
    e.preventDefault();
    await submitApplication();
});

document.querySelectorAll(
    "#customerName,#mobile,#email,#whatsapp,#service,#address,#requirement"
).forEach(field=>{
    field.addEventListener("input",scheduleAutoSave);
    field.addEventListener("change",scheduleAutoSave);
});

document.getElementById("document").addEventListener("change",async()=>{
    const file=document.getElementById("document").files[0];

    if(!file) return;

    try{
        if(!draftApplication){
            const data=formData();

            if(!data.service){
                showMessage("Please select a service before uploading a document.","error");
                return;
            }

            await createDraft(data);
        }

        await uploadDocument(file);
    }catch(error){
        console.error("Document upload error:",error);
        showMessage(
            "Document upload failed: "+
            (error.message || "Unknown error"),
            "error"
        );
    }
});

window.addEventListener("beforeunload",()=>{
    if(hasMeaningfulData(formData())){
        navigator.sendBeacon;
    }
});

loadDraftOrDefaults().catch(error=>{
    console.error("Application page error:",error);
    showMessage(
        "Unable to load application: "+
        (error.message || "Unknown error"),
        "error"
    );
});
</script>
</body>
</html>
