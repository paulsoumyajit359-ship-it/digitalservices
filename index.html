<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Digital Service</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 60px;
            height: 60px;

            background: #172033;
            color: #ffffff;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;

            color: #172033;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666666;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333333;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #cccccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #1769d1;

            box-shadow:
                0 0 0 3px rgba(23, 105, 209, 0.10);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #172033;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;
        }

        button:hover {
            background: #0d1422;
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;

            text-align: center;

            font-weight: bold;

            line-height: 1.5;

            min-height: 22px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #1769d1;

            text-decoration: none;

            font-size: 15px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>


<body>

<div class="login-box">

    <!-- Logo -->
    <div class="logo">
        DS
    </div>


    <!-- Heading -->
    <h1>
        Admin Login
    </h1>


    <p class="subtitle">
        Digital Service Administrator Panel
    </p>


    <!-- Login Form -->
    <form id="adminLoginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Admin Login
        </button>

    </form>


    <!-- Message -->
    <div id="message"></div>


    <!-- Back to Customer Login -->
    <a
        href="login.html"
        class="back"
    >
        ← Customer Login
    </a>

</div>


<script>

    // =========================================================
    // SUPABASE CONFIGURATION
    // =========================================================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // =========================================================
    // ADMIN UID
    // =========================================================

    const ADMIN_UID =
        "e3c0a5b6-7bb7-4efa-b7c4-64b37cc84b08";


    // =========================================================
    // GET HTML ELEMENTS
    // =========================================================

    const form =
        document.getElementById("adminLoginForm");


    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("password");


    const loginButton =
        document.getElementById("loginButton");


    const message =
        document.getElementById("message");


    // =========================================================
    // SHOW MESSAGE
    // =========================================================

    function showMessage(text, type) {

        message.textContent = text;


        if (type === "success") {

            message.style.color = "#0a9f4b";

        } else {

            message.style.color = "#ff0000";

        }

    }


    // =========================================================
    // ADMIN LOGIN
    // =========================================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            // -------------------------------------------------
            // GET INPUT VALUES
            // -------------------------------------------------

            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            // -------------------------------------------------
            // RESET MESSAGE
            // -------------------------------------------------

            message.textContent = "";


            // -------------------------------------------------
            // DISABLE BUTTON
            // -------------------------------------------------

            loginButton.disabled = true;

            loginButton.textContent =
                "Checking...";


            try {

                // =================================================
                // SIGN IN WITH SUPABASE
                // =================================================

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                // -------------------------------------------------
                // CHECK LOGIN ERROR
                // -------------------------------------------------

                if (error) {

                    throw new Error(
                        "Invalid login credentials."
                    );

                }


                // =================================================
                // GET LOGGED-IN USER
                // =================================================

                const user =
                    data.user;


                if (!user) {

                    throw new Error(
                        "Unable to verify account."
                    );

                }


                // =================================================
                // CHECK ADMIN UID
                // =================================================

                if (user.id !== ADMIN_UID) {

                    // Logout non-admin user immediately

                    await supabaseClient.auth.signOut();


                    throw new Error(
                        "Access denied. This account is not an administrator."
                    );

                }


                // =================================================
                // ADMIN VERIFIED
                // =================================================

                showMessage(
                    "Admin login successful. Opening dashboard...",
                    "success"
                );


                // -------------------------------------------------
                // OPEN ADMIN DASHBOARD
                // -------------------------------------------------

                setTimeout(
                    function() {

                        window.location.href =
                            "admin-dashboard.html";

                    },
                    700
                );

            }


            catch (error) {

                console.error(
                    "Admin login error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Admin login failed.",
                    "error"
                );

            }


            finally {

                // -------------------------------------------------
                // ENABLE BUTTON AGAIN
                // -------------------------------------------------

                loginButton.disabled = false;

                loginButton.textContent =
                    "Admin Login";

            }

        }
    );

</script>

</body>
</html>
