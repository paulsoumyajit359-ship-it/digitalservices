<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #172033;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #172033;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #0d1422;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .password-wrapper input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 50px 13px 13px;
            margin-bottom: 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 0;
            margin: 0;
            background: transparent;
            border: none;
            color: #555;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: transparent;
            color: #111;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769d1;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">DS</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Digital Service Administrator Panel
    </p>

    <form id="adminLoginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="email"
            required
        >

        <label for="password">
            Password
        </label>

        <div class="password-wrapper">
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Show password">👁</button>
        </div>

        <button
            type="submit"
            id="loginButton"
        >
            Admin Login
        </button>

    </form>

    <div id="message"></div>

    <a
        href="login.html"
        class="back"
    >
        ← Customer Login
    </a>

</div>


<script>

    function togglePassword() {

        const input = document.getElementById("password");
        const button = document.querySelector(".toggle-password");

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "🙈";
            button.setAttribute("aria-label", "Hide password");
        } else {
            input.type = "password";
            button.textContent = "👁";
            button.setAttribute("aria-label", "Show password");
        }
    }


    // =========================================================
    // SUPABASE CONFIG
    // =========================================================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // =========================================================
    // ADMIN UID
    // =========================================================

    const ADMIN_UID =
        "e3c0a5b6-7bb7-4efa-b7c4-64b37cc84b08";


    // =========================================================
    // ELEMENTS
    // =========================================================

    const form =
        document.getElementById("adminLoginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    // =========================================================
    // ADMIN LOGIN
    // =========================================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            message.textContent = "";

            loginButton.disabled = true;
            loginButton.textContent = "Checking...";


            try {

                // -------------------------------------------------
                // SIGN IN
                // -------------------------------------------------

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {
                    throw error;
                }


                // -------------------------------------------------
                // CHECK USER
                // -------------------------------------------------

                const user =
                    data.user;


                if (!user) {

                    throw new Error(
                        "Unable to verify account."
                    );

                }


                // -------------------------------------------------
                // ADMIN UID CHECK
                // -------------------------------------------------

                if (user.id !== ADMIN_UID) {

                    await supabaseClient.auth.signOut();

                    throw new Error(
                        "Access denied. This account is not an administrator."
                    );

                }


                // -------------------------------------------------
                // SUCCESS
                // -------------------------------------------------

                message.style.color = "green";

                message.textContent =
                    "Admin login successful. Opening dashboard...";


                setTimeout(function() {

                    window.location.href =
                        "admin-dashboard.html";

                }, 800);


            } catch (error) {

                console.error(
                    "Admin login error:",
                    error
                );

                message.style.color = "red";

                message.textContent =
                    error.message ||
                    "Admin login failed.";

            }


            loginButton.disabled = false;
            loginButton.textContent = "Admin Login";

        }
    );

</script>

</body>
</html>
