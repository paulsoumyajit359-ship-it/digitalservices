<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Login | Digital Service</title>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f4f7fb;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-box {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.12);

        }


        .logo {

            width: 60px;

            height: 60px;

            background: #1769d1;

            color: white;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 15px;

            font-size: 24px;

            font-weight: bold;

        }


        h1 {

            text-align: center;

            color: #172033;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #1769d1;

            box-shadow:
                0 0 0 2px rgba(23,105,209,0.10);

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1769d1;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

        }


        button:hover {

            background: #0d55b3;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .forgot {

            display: block;

            text-align: right;

            margin: 3px 0 15px;

            color: #1769d1;

            text-decoration: none;

            font-size: 14px;

        }


        .forgot:hover {

            text-decoration: underline;

        }


        #message {

            margin-top: 18px;

            text-align: center;

            font-weight: bold;

            line-height: 1.5;

        }


        .links {

            text-align: center;

            margin-top: 20px;

            color: #555;

        }


        .links a {

            color: #1769d1;

            text-decoration: none;

            font-weight: bold;

        }


        .links a:hover {

            text-decoration: underline;

        }


        /*
        =========================================================
        IMPORTANT:
        NO ADMIN LOGIN LINK HERE
        =========================================================
        */

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        DS
    </div>


    <h1>
        Customer Login
    </h1>


    <p class="subtitle">
        Digital • Tax • Business Services
    </p>


    <form id="loginForm">


        <label for="email">
            Email Address
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <div class="password-wrapper">
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Show password">&#128065;</button>
        </div>

        <a
            href="#"
            id="forgotPassword"
            class="forgot"
        >
            Forgot Password?
        </a>


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


    </form>


    <div id="message"></div>


    <div class="links">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </div>


</div>



<script>

    function togglePassword() {

        const input = document.getElementById("password");
        const button = document.querySelector(".toggle-password");

        if (input.type === "password") {
            input.type = "text";
            button.classList.add("password-visible");
            button.setAttribute("aria-label", "Hide password");
        } else {
            input.type = "password";
            button.classList.remove("password-visible");
            button.setAttribute("aria-label", "Show password");
        }
    }



    // =========================================================
    // SUPABASE CONFIG
    // =========================================================


    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    // =========================================================
    // ELEMENTS
    // =========================================================


    const loginForm =
        document.getElementById("loginForm");


    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("password");


    const loginButton =
        document.getElementById("loginButton");


    const forgotPassword =
        document.getElementById("forgotPassword");


    const message =
        document.getElementById("message");



    // =========================================================
    // CUSTOMER LOGIN
    // =========================================================


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            message.textContent = "";


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            try {


                const { data, error } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                if (error) {

                    throw error;

                }


                const user =
                    data.user;


                if (!user) {

                    throw new Error(
                        "Unable to verify account."
                    );

                }


                message.style.color =
                    "green";


                message.textContent =
                    "Login successful!";


                setTimeout(
                    function() {

                        window.location.href =
                            "customer-dashboard.html";

                    },
                    800
                );


            }

            catch (error) {


                console.error(
                    "Login error:",
                    error
                );


                message.style.color =
                    "red";


                message.textContent =
                    error.message ||
                    "Login failed.";

            }


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Login";

        }
    );



    // =========================================================
    // FORGOT PASSWORD
    // =========================================================


    forgotPassword.addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            message.textContent = "";


            if (!email) {


                message.style.color =
                    "red";


                message.textContent =
                    "Please enter your email address first.";


                emailInput.focus();


                return;

            }


            forgotPassword.style.pointerEvents =
                "none";


            forgotPassword.style.opacity =
                "0.6";


            message.style.color =
                "#1769d1";


            message.textContent =
                "Sending password reset email...";


            try {


                localStorage.setItem(
                    "resetEmail",
                    email
                );


                const { error } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {

                                redirectTo:
                                    window.location.origin +
                                    "/reset-password.html"

                            }
                        );


                if (error) {

                    throw error;

                }


                message.style.color =
                    "green";


                message.textContent =
                    "Password reset email sent. Opening reset page...";


                setTimeout(
                    function() {

                        window.location.href =
                            "reset-password.html";

                    },
                    1000
                );


            }

            catch (error) {


                console.error(
                    "Password reset error:",
                    error
                );


                message.style.color =
                    "red";


                message.textContent =
                    error.message ||
                    "Failed to send password reset email.";


                forgotPassword.style.pointerEvents =
                    "auto";


                forgotPassword.style.opacity =
                    "1";

            }

        }
    );


</script>


</body>

</html>
