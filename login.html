<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1769d1;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1769d1;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769d1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d55b3;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #1769d1;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">DS</div>

    <h1>Customer Login</h1>

    <p class="subtitle">
        Digital • Tax • Business Services
    </p>

    <form id="loginForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="links">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

</div>

<script>

    // ==============================
    // SUPABASE CONFIGURATION
    // ==============================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


    // Create Supabase client
    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    // ==============================
    // LOGIN
    // ==============================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            const button =
                document.getElementById("loginButton");


            message.textContent = "";
            button.disabled = true;
            button.textContent = "Logging in...";


            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {
                    throw error;
                }


                message.style.color = "green";
                message.textContent =
                    "Login successful!";


                // Redirect after successful login
                setTimeout(function() {

                    window.location.href = "index.html";

                }, 1000);


            } catch (error) {

                message.style.color = "red";
                message.textContent =
                    error.message;

            }


            button.disabled = false;
            button.textContent = "Login";

        });

</script>

</body>
</html>
