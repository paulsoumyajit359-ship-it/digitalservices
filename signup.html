<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Sign Up - Digital Service</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .auth-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-card .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769d1;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #0f56b3;
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #1769d1;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #e8f7ee;
            color: #16733a;
        }

        .message.error {
            display: block;
            background: #fdeaea;
            color: #b42318;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo-area">

            <div class="logo-box">
                DS
            </div>

            <div>
                <h1>Digital Service</h1>
                <p>Digital • Tax • Business Services</p>
            </div>

        </div>

        <a href="index.html" class="home-btn">
            Home
        </a>

    </header>


    <!-- SIGN UP -->
    <main class="auth-container">

        <div class="auth-card">

            <h2>Create Customer Account</h2>

            <p class="subtitle">
                Register to apply for digital services
            </p>


            <form id="signupForm">

                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- MOBILE -->
                <div class="form-group">

                    <label for="mobile">
                        Mobile Number *
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        maxlength="10"
                        inputmode="numeric"
                        placeholder="Enter 10 digit mobile number"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email Address *
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password *
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password *
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="signup-btn"
                    id="signupButton"
                >
                    Create Account
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Customer Login
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 Digital Service. All Rights Reserved.
        </p>

    </footer>


    <script>

        /* ==============================
           SUPABASE CONFIGURATION
        ============================== */

        const SUPABASE_URL =
            "https://nlzrdjvlkdqungmhnsrl.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ==============================
           SIGN UP
        ============================== */

        document
            .getElementById("signupForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const fullName =
                    document
                        .getElementById("fullName")
                        .value
                        .trim();


                const mobile =
                    document
                        .getElementById("mobile")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const message =
                    document.getElementById("message");


                const button =
                    document.getElementById("signupButton");


                /* Clear old message */

                message.className = "message";
                message.textContent = "";


                /* ==============================
                   VALIDATION
                ============================== */

                if (fullName.length < 2) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Please enter your full name.";

                    return;
                }


                if (!/^[0-9]{10}$/.test(mobile)) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Please enter a valid 10 digit mobile number.";

                    return;
                }


                if (password.length < 8) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Password must be at least 8 characters.";

                    return;
                }


                if (password !== confirmPassword) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                /* ==============================
                   DISABLE BUTTON
                ============================== */

                button.disabled = true;
                button.textContent = "Creating Account...";


                try {

                    /* ==============================
                       CREATE SUPABASE ACCOUNT
                    ============================== */

                    const { data, error } =
                        await supabaseClient.auth.signUp({

                            email: email,

                            password: password,

                            options: {

                                data: {

                                    full_name: fullName,

                                    mobile: mobile

                                },

                                emailRedirectTo:
                                    "https://paulsoumyajit359-ship-it.github.io/digitalservices/"

                            }

                        });


                    /* ==============================
                       ERROR
                    ============================== */

                    if (error) {

                        throw error;

                    }


                    /* ==============================
                       SUCCESS
                    ============================== */

                    message.className =
                        "message success";


                    if (data.user && !data.session) {

                        message.textContent =
                            "Account created successfully! Please check your email and verify your account before logging in.";

                    } else {

                        message.textContent =
                            "Account created successfully! You can now login.";

                    }


                    /* Clear password fields */

                    document
                        .getElementById("password")
                        .value = "";

                    document
                        .getElementById("confirmPassword")
                        .value = "";


                } catch (error) {

                    console.error(
                        "Signup Error:",
                        error
                    );


                    message.className =
                        "message error";


                    message.textContent =
                        error.message ||
                        "Unable to create account. Please try again.";

                }


                /* ==============================
                   ENABLE BUTTON
                ============================== */

                button.disabled = false;

                button.textContent =
                    "Create Account";

            });

    </script>

</body>
</html>
