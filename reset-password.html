<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1769d1;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769d1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d55b3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1769d1;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">DS</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Create a new password for your account
    </p>

    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit" id="resetButton">
            Update Password
        </button>

    </form>

    <div id="message"></div>

    <div class="back">
        <a href="login.html">Back to Login</a>
    </div>

</div>


<script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const resetForm =
        document.getElementById("resetForm");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const message =
        document.getElementById("message");

    const resetButton =
        document.getElementById("resetButton");


    // ==========================================
    // CHECK RESET SESSION
    // ==========================================

    async function checkResetSession() {

        const {
            data: { session },
            error
        } = await supabaseClient.auth.getSession();


        if (error) {

            message.style.color = "red";

            message.textContent =
                "Unable to verify password reset session.";

            resetForm.classList.add("hidden");

            return;
        }


        if (!session) {

            message.style.color = "red";

            message.textContent =
                "This password reset link is invalid or has expired.";

            resetForm.classList.add("hidden");

            return;
        }


        // Valid recovery session
        resetForm.classList.remove("hidden");

    }


    // ==========================================
    // PASSWORD UPDATE
    // ==========================================

    resetForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            message.textContent = "";


            // Password match

            if (password !== confirmPassword) {

                message.style.color = "red";

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            // Password length

            if (password.length < 8) {

                message.style.color = "red";

                message.textContent =
                    "Password must be at least 8 characters.";

                return;
            }


            resetButton.disabled = true;

            resetButton.textContent =
                "Updating...";


            try {

                const { error } =
                    await supabaseClient.auth.updateUser({

                        password: password

                    });


                if (error) {
                    throw error;
                }


                message.style.color = "green";

                message.textContent =
                    "Password updated successfully!";


                resetButton.textContent =
                    "Password Updated";


                // Sign out recovery session

                await supabaseClient.auth.signOut();


                // Go to login

                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1500);


            } catch (error) {

                message.style.color = "red";

                message.textContent =
                    error.message;

                resetButton.disabled = false;

                resetButton.textContent =
                    "Update Password";

            }

        }
    );


    // ==========================================
    // START
    // ==========================================

    checkResetSession();

</script>

</body>
</html>
