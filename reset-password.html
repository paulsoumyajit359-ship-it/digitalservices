<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #111827;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .logo {
            width: 64px;
            height: 64px;
            background: #2563eb;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 18px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin: 8px 0 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        #otp {
            letter-spacing: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 12px;
            border-radius: 8px;
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">DS</div>

        <h1>Reset Password</h1>

        <div class="subtitle">
            Reset your Digital Service account password
        </div>

        <div class="info">
            Enter the 6-digit OTP sent to your email address,
            then create your new password.
        </div>

        <!-- EMAIL -->
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
        >

        <!-- OTP -->
        <label for="otp">OTP</label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
        >

        <!-- NEW PASSWORD -->
        <label for="newPassword">New Password</label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
        >

        <!-- CONFIRM PASSWORD -->
        <label for="confirmPassword">Confirm New Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
        >

        <button id="resetButton">
            Reset Password
        </button>

        <div id="message" class="message"></div>

        <div class="back">
            <a href="login.html">← Back to Login</a>
        </div>

    </div>

</div>


<script>

    // =========================================================
    // SUPABASE CONFIG
    // =========================================================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // =========================================================
    // GET ELEMENTS
    // =========================================================

    const emailInput =
        document.getElementById("email");

    const newPasswordInput =
        document.getElementById("newPassword");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const resetButton =
        document.getElementById("resetButton");

    const message =
        document.getElementById("message");


    // =========================================================
    // CREATE OTP BOX IF IT DOES NOT EXIST
    // =========================================================

    let otpInput =
        document.getElementById("otp");


    if (!otpInput) {

        const otpLabel =
            document.createElement("label");

        otpLabel.textContent =
            "6-Digit OTP";

        otpLabel.style.display = "block";
        otpLabel.style.marginTop = "15px";
        otpLabel.style.marginBottom = "7px";
        otpLabel.style.fontWeight = "bold";
        otpLabel.style.color = "#333";


        otpInput =
            document.createElement("input");

        otpInput.type = "text";
        otpInput.id = "otp";
        otpInput.name = "otp";
        otpInput.placeholder = "Enter 6-digit OTP";
        otpInput.maxLength = 6;
        otpInput.inputMode = "numeric";
        otpInput.autocomplete = "one-time-code";

        otpInput.style.width = "100%";
        otpInput.style.padding = "13px";
        otpInput.style.marginBottom = "10px";
        otpInput.style.border = "1px solid #ccc";
        otpInput.style.borderRadius = "8px";
        otpInput.style.fontSize = "18px";
        otpInput.style.textAlign = "center";
        otpInput.style.letterSpacing = "5px";


        if (newPasswordInput) {

            newPasswordInput.parentNode.insertBefore(
                otpLabel,
                newPasswordInput
            );

            newPasswordInput.parentNode.insertBefore(
                otpInput,
                newPasswordInput
            );

        }

    }


    // =========================================================
    // FORCE OTP BOX TO BE VISIBLE
    // =========================================================

    if (otpInput) {

        otpInput.style.display = "block";
        otpInput.style.visibility = "visible";
        otpInput.style.opacity = "1";

    }


    // =========================================================
    // OTP ONLY NUMBERS
    // =========================================================

    otpInput.addEventListener("input", function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);

    });


    // =========================================================
    // LOAD SAVED EMAIL
    // =========================================================

    const savedEmail =
        localStorage.getItem("resetEmail");

    if (savedEmail && emailInput) {

        emailInput.value = savedEmail;

    }


    // =========================================================
    // RESET PASSWORD
    // =========================================================

    resetButton.addEventListener(
        "click",
        async function () {

            message.textContent = "";
            message.style.color = "red";


            const email =
                emailInput.value.trim();

            const otp =
                otpInput.value.trim();

            const newPassword =
                newPasswordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            // =================================================
            // VALIDATION
            // =================================================

            if (!email) {

                message.textContent =
                    "Please enter your email address.";

                emailInput.focus();

                return;
            }


            if (!otp) {

                message.textContent =
                    "Please enter the 6-digit OTP.";

                otpInput.focus();

                return;
            }


            if (!/^\d{6}$/.test(otp)) {

                message.textContent =
                    "OTP must be exactly 6 digits.";

                otpInput.focus();

                return;
            }


            if (!newPassword) {

                message.textContent =
                    "Please enter your new password.";

                newPasswordInput.focus();

                return;
            }


            if (newPassword.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                newPasswordInput.focus();

                return;
            }


            if (newPassword !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                confirmPasswordInput.focus();

                return;
            }


            // =================================================
            // DISABLE BUTTON
            // =================================================

            resetButton.disabled = true;

            resetButton.textContent =
                "Verifying OTP...";


            try {

                // =============================================
                // VERIFY OTP
                // =============================================

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.verifyOtp({

                        email: email,

                        token: otp,

                        type: "recovery"

                    });


                if (error) {

                    throw error;

                }


                // =============================================
                // UPDATE PASSWORD
                // =============================================

                resetButton.textContent =
                    "Updating Password...";


                const {
                    error: updateError
                } =
                    await supabaseClient.auth.updateUser({

                        password: newPassword

                    });


                if (updateError) {

                    throw updateError;

                }


                // =============================================
                // SUCCESS
                // =============================================

                message.style.color = "green";

                message.textContent =
                    "Password updated successfully! Redirecting to Login...";


                localStorage.removeItem(
                    "resetEmail"
                );


                // Sign out recovery session

                await supabaseClient.auth.signOut();


                // Redirect

                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 2000);


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                message.style.color = "red";

                message.textContent =
                    error.message ||
                    "Invalid or expired OTP. Please try again.";


                resetButton.disabled = false;

                resetButton.textContent =
                    "Reset Password";

            }

        }
    );

</script>
</body>
</html>
