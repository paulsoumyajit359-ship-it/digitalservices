<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #111827;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 470px;
            background: white;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .logo {
            width: 64px;
            height: 64px;
            background: #1769d5;
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 27px;
            font-weight: bold;
            margin: 0 auto 18px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1769d5;
        }

        .otp-input {
            letter-spacing: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #1769d5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1259b5;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: #1769d5;
            text-decoration: none;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .small-text {
            color: #64748b;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">DS</div>

        <h1>Reset Password</h1>

        <div class="subtitle">
            Reset your Digital Service account password
        </div>


        <!-- ========================= -->
        <!-- STEP 1 : EMAIL + OTP -->
        <!-- ========================= -->

        <div id="step1" class="step active">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="email"
            >

            <button id="sendOtpButton">
                Send OTP
            </button>

            <div id="sendMessage" class="message"></div>

        </div>


        <!-- ========================= -->
        <!-- STEP 2 : VERIFY OTP -->
        <!-- ========================= -->

        <div id="step2" class="step">

            <label for="otp">Enter OTP</label>

            <input
                type="text"
                id="otp"
                class="otp-input"
                placeholder="6-digit OTP"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

            <div class="small-text">
                Enter the 6-digit OTP sent to your email.
            </div>

            <button id="verifyOtpButton">
                Verify OTP
            </button>

            <div id="otpMessage" class="message"></div>

        </div>


        <!-- ========================= -->
        <!-- STEP 3 : NEW PASSWORD -->
        <!-- ========================= -->

        <div id="step3" class="step">

            <label for="newPassword">New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
            >

            <label for="confirmPassword">Confirm New Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password"
                autocomplete="new-password"
            >

            <button id="resetButton">
                Reset Password
            </button>

            <div id="resetMessage" class="message"></div>

        </div>


        <div class="back">
            <a href="login.html">← Back to Login</a>
        </div>

    </div>

</div>


<script>

    // =========================================================
    // SUPABASE CONFIG
    // =========================================================

    // IMPORTANT:
    // Use the EXACT SAME values from your login.html

    const SUPABASE_URL = "https://nlzrdjvlkdqungmhnsrl.supabase.co/";
    const SUPABASE_ANON_KEY = "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // =========================================================
    // ELEMENTS
    // =========================================================

    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");

    const sendOtpButton = document.getElementById("sendOtpButton");
    const verifyOtpButton = document.getElementById("verifyOtpButton");
    const resetButton = document.getElementById("resetButton");

    const sendMessage = document.getElementById("sendMessage");
    const otpMessage = document.getElementById("otpMessage");
    const resetMessage = document.getElementById("resetMessage");

    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("step3");


    // =========================================================
    // SEND OTP
    // =========================================================

    sendOtpButton.addEventListener("click", async function () {

        const email = emailInput.value.trim();

        sendMessage.textContent = "";
        sendMessage.className = "message";

        if (!email) {
            sendMessage.textContent = "Please enter your email address.";
            sendMessage.classList.add("error");
            return;
        }

        sendOtpButton.disabled = true;
        sendOtpButton.textContent = "Sending OTP...";

        try {

            /*
             * Supabase sends a recovery OTP to the email.
             */

            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
    window.location.origin + "/reset-password"
                    }
                );

            if (error) {
                throw error;
            }

            sendMessage.textContent =
                "OTP sent successfully. Please check your email.";

            sendMessage.classList.add("success");

            /*
             * Move to OTP screen
             */

            step1.classList.remove("active");
            step2.classList.add("active");

            otpInput.focus();

        } catch (error) {

            console.error(error);

            sendMessage.textContent =
                error.message || "Failed to send OTP.";

            sendMessage.classList.add("error");

            sendOtpButton.disabled = false;
            sendOtpButton.textContent = "Send OTP";
        }

    });


    // =========================================================
    // VERIFY OTP
    // =========================================================

    verifyOtpButton.addEventListener("click", async function () {

        const email = emailInput.value.trim();
        const token = otpInput.value.trim();

        otpMessage.textContent = "";
        otpMessage.className = "message";

        if (!email) {
            otpMessage.textContent =
                "Email address is missing.";

            otpMessage.classList.add("error");
            return;
        }

        if (!token || token.length !== 6) {

            otpMessage.textContent =
                "Please enter the 6-digit OTP.";

            otpMessage.classList.add("error");
            return;
        }

        verifyOtpButton.disabled = true;
        verifyOtpButton.textContent = "Verifying...";

        try {

            const { data, error } =
                await supabaseClient.auth.verifyOtp({
                    email: email,
                    token: token,
                    type: "recovery"
                });

            if (error) {
                throw error;
            }

            console.log("OTP verified:", data);

            otpMessage.textContent =
                "OTP verified successfully.";

            otpMessage.classList.add("success");

            /*
             * Show password reset form
             */

            setTimeout(function () {

                step2.classList.remove("active");
                step3.classList.add("active");

                document.getElementById("newPassword").focus();

            }, 700);

        } catch (error) {

            console.error(error);

            otpMessage.textContent =
                error.message ||
                "Invalid or expired OTP.";

            otpMessage.classList.add("error");

            verifyOtpButton.disabled = false;
            verifyOtpButton.textContent = "Verify OTP";
        }

    });


    // =========================================================
    // RESET PASSWORD
    // =========================================================

    resetButton.addEventListener("click", async function () {

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        resetMessage.textContent = "";
        resetMessage.className = "message";


        if (!newPassword || !confirmPassword) {

            resetMessage.textContent =
                "Please fill in both password fields.";

            resetMessage.classList.add("error");
            return;
        }


        if (newPassword.length < 6) {

            resetMessage.textContent =
                "Password must be at least 6 characters.";

            resetMessage.classList.add("error");
            return;
        }


        if (newPassword !== confirmPassword) {

            resetMessage.textContent =
                "Passwords do not match.";

            resetMessage.classList.add("error");
            return;
        }


        resetButton.disabled = true;
        resetButton.textContent = "Updating Password...";


        try {

            const { data, error } =
                await supabaseClient.auth.updateUser({
                    password: newPassword
                });

            if (error) {
                throw error;
            }

            console.log("Password updated:", data);

            resetMessage.textContent =
                "Password updated successfully! Redirecting to Login...";

            resetMessage.classList.add("success");

            resetButton.textContent =
                "Password Updated";


            /*
             * Sign out after successful password change
             */

            await supabaseClient.auth.signOut();


            /*
             * Redirect to login
             */

            setTimeout(function () {

                window.location.href = "login.html";

            }, 2000);


        } catch (error) {

            console.error(error);

            resetMessage.textContent =
                error.message ||
                "Failed to update password.";

            resetMessage.classList.add("error");

            resetButton.disabled = false;
            resetButton.textContent = "Reset Password";
        }

    });


    // =========================================================
    // ONLY ALLOW NUMBERS IN OTP
    // =========================================================

    otpInput.addEventListener("input", function () {

        this.value = this.value
            .replace(/\D/g, "")
            .slice(0, 6);

    });

</script>

</body>
</html>
