<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1769d1;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        #otp {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769d1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #0d55b3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary {
            background: #eef3f9;
            color: #1769d1;
            margin-top: 12px;
        }

        .secondary:hover {
            background: #e1eaf5;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1769d1;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }

        .step-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #172033;
            margin-bottom: 18px;
        }

        .email-display {
            background: #f4f7fb;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            color: #555;
            margin-bottom: 20px;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">DS</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Reset your Digital Service account password
    </p>


    <!-- ==========================================
         STEP 1 - OTP VERIFICATION
    =========================================== -->

    <div id="otpSection">

        <div class="step-title">
            Verify OTP
        </div>

        <div class="email-display">
            OTP sent to:<br>
            <strong id="emailDisplay"></strong>
        </div>

        <label for="otp">
            Enter OTP
        </label>

        <input
            type="text"
            id="otp"
            placeholder="6-digit OTP"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
        >

        <button type="button" id="verifyButton">
            Verify OTP
        </button>

        <button type="button" id="resendButton" class="secondary">
            Resend OTP
        </button>

    </div>


    <!-- ==========================================
         STEP 2 - NEW PASSWORD
    =========================================== -->

    <div id="passwordSection" class="hidden">

        <div class="step-title">
            Create New Password
        </div>

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="button" id="resetButton">
            Update Password
        </button>

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- BACK -->

    <div class="back">
        <a href="login.html">Back to Login</a>
    </div>

</div>


<script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const otpSection =
        document.getElementById("otpSection");

    const passwordSection =
        document.getElementById("passwordSection");

    const emailDisplay =
        document.getElementById("emailDisplay");

    const otpInput =
        document.getElementById("otp");

    const verifyButton =
        document.getElementById("verifyButton");

    const resendButton =
        document.getElementById("resendButton");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const resetButton =
        document.getElementById("resetButton");

    const message =
        document.getElementById("message");


    // ==========================================
    // GET RESET EMAIL
    // ==========================================

    let resetEmail =
        localStorage.getItem("resetEmail");


    // ==========================================
    // CHECK EMAIL
    // ==========================================

    if (!resetEmail) {

        otpSection.classList.add("hidden");

        message.style.color = "red";

        message.textContent =
            "Reset email not found. Please go back to Login and click Forgot Password again.";

    } else {

        emailDisplay.textContent =
            resetEmail;

    }


    // ==========================================
    // VERIFY OTP
    // ==========================================

    verifyButton.addEventListener(
        "click",
        async function() {

            const otp =
                otpInput.value.trim();


            message.textContent = "";


            if (!resetEmail) {

                message.style.color = "red";

                message.textContent =
                    "Email address not found.";

                return;
            }


            if (!otp) {

                message.style.color = "red";

                message.textContent =
                    "Please enter the OTP.";

                return;
            }


            if (!/^\d{6}$/.test(otp)) {

                message.style.color = "red";

                message.textContent =
                    "OTP must be exactly 6 digits.";

                return;
            }


            verifyButton.disabled = true;

            verifyButton.textContent =
                "Verifying...";


            try {

                const { data, error } =
                    await supabaseClient.auth.verifyOtp({

                        email: resetEmail,

                        token: otp,

                        type: "recovery"

                    });


                if (error) {
                    throw error;
                }


                // OTP verified successfully

                message.style.color = "green";

                message.textContent =
                    "OTP verified successfully.";


                otpSection.classList.add("hidden");

                passwordSection.classList.remove("hidden");


            } catch (error) {

                message.style.color = "red";

                message.textContent =
                    error.message ||
                    "Invalid or expired OTP.";

                verifyButton.disabled = false;

                verifyButton.textContent =
                    "Verify OTP";

            }

        }
    );


    // ==========================================
    // RESEND OTP
    // ==========================================

    resendButton.addEventListener(
        "click",
        async function() {

            if (!resetEmail) {

                message.style.color = "red";

                message.textContent =
                    "Email address not found.";

                return;
            }


            resendButton.disabled = true;

            resendButton.textContent =
                "Sending...";

            message.textContent = "";


            try {

                const { error } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            resetEmail,
                            {
                                redirectTo:
                                    window.location.origin +
                                    "/digitalservices/reset-password.html"
                            }
                        );


                if (error) {
                    throw error;
                }


                message.style.color = "green";

                message.textContent =
                    "A new OTP has been sent to your email.";


            } catch (error) {

                message.style.color = "red";

                message.textContent =
                    error.message;

            }


            resendButton.disabled = false;

            resendButton.textContent =
                "Resend OTP";

        }
    );


    // ==========================================
    // UPDATE PASSWORD
    // ==========================================

    resetButton.addEventListener(
        "click",
        async function() {

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            message.textContent = "";


            // Check password

            if (password.length < 8) {

                message.style.color = "red";

                message.textContent =
                    "Password must be at least 8 characters.";

                return;
            }


            // Check matching

            if (password !== confirmPassword) {

                message.style.color = "red";

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            resetButton.disabled = true;

            resetButton.textContent =
                "Updating...";


            try {

                const { error } =
                    await supabaseClient.auth.updateUser({

                        password: password

                    });


                if (error) {
                    throw error;
                }


                message.style.color = "green";

                message.textContent =
                    "Password updated successfully! Redirecting to Login...";


                resetButton.textContent =
                    "Password Updated";


                // Remove reset email

                localStorage.removeItem(
                    "resetEmail"
                );


                // Sign out recovery session

                await supabaseClient.auth.signOut();


                // Redirect to login

                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1800);


            } catch (error) {

                message.style.color = "red";

                message.textContent =
                    error.message ||
                    "Unable to update password.";

                resetButton.disabled = false;

                resetButton.textContent =
                    "Update Password";

            }

        }
    );


    // ==========================================
    // OTP INPUT - ONLY NUMBERS
    // ==========================================

    otpInput.addEventListener(
        "input",
        function() {

            this.value =
                this.value.replace(/\D/g, "");

        }
    );

</script>

</body>
</html>
