<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1769d1;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1769d1;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769d1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d55b3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1769d1;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .note {
            background: #f0f6ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #315477;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">DS</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter the verification code sent to your email
    </p>

    <div class="note">
        Check your email for the 6-digit password reset code.
    </div>

    <form id="resetForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
        >

        <label for="otp">
            Reset Code
        </label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit code"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            required
        >

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit" id="resetButton">
            Verify & Update Password
        </button>

    </form>

    <div id="message"></div>

    <div class="back">
        <a href="login.html">Back to Login</a>
    </div>

</div>


<script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const resetForm =
        document.getElementById("resetForm");

    const emailInput =
        document.getElementById("email");

    const otpInput =
        document.getElementById("otp");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const message =
        document.getElementById("message");

    const resetButton =
        document.getElementById("resetButton");


    // ==========================================
    // FORM SUBMIT
    // ==========================================

    resetForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            const otp =
                otpInput.value.trim();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            message.textContent = "";


            // ==========================================
            // VALIDATION
            // ==========================================

            if (!email) {

                message.style.color = "red";

                message.textContent =
                    "Please enter your email address.";

                return;
            }


            if (!/^\d{6}$/.test(otp)) {

                message.style.color = "red";

                message.textContent =
                    "Please enter the 6-digit reset code.";

                return;
            }


            if (password.length < 8) {

                message.style.color = "red";

                message.textContent =
                    "Password must be at least 8 characters.";

                return;
            }


            if (password !== confirmPassword) {

                message.style.color = "red";

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            // ==========================================
            // DISABLE BUTTON
            // ==========================================

            resetButton.disabled = true;

            resetButton.textContent =
                "Verifying...";


            try {

                // ==========================================
                // VERIFY RESET OTP
                // ==========================================

                const {
                    data,
                    error: verifyError
                } =
                    await supabaseClient.auth.verifyOtp({

                        email: email,

                        token: otp,

                        type: "recovery"

                    });


                if (verifyError) {

                    throw verifyError;

                }


                // ==========================================
                // VERIFY SESSION
                // ==========================================

                const {
                    data: sessionData,
                    error: sessionError
                } =
                    await supabaseClient.auth.getSession();


                if (sessionError ||
                    !sessionData.session) {

                    throw new Error(
                        "Password reset session could not be created."
                    );

                }


                // ==========================================
                // UPDATE PASSWORD
                // ==========================================

                resetButton.textContent =
                    "Updating Password...";


                const {
                    error: updateError
                } =
                    await supabaseClient.auth.updateUser({

                        password: password

                    });


                if (updateError) {

                    throw updateError;

                }


                // ==========================================
                // SUCCESS
                // ==========================================

                message.style.color = "green";

                message.textContent =
                    "Password updated successfully! Redirecting to login...";


                resetButton.textContent =
                    "Password Updated";


                // Sign out after successful password change

                await supabaseClient.auth.signOut();


                // Redirect to login

                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 2000);


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                message.style.color = "red";

                message.textContent =
                    error.message ||
                    "Unable to reset password. Please try again.";


                resetButton.disabled = false;

                resetButton.textContent =
                    "Verify & Update Password";

            }

        }
    );

</script>

</body>
</html>
