<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Digital Service</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1769d1;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        #otp {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769d1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d55b3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1769d1;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }

        .email-info {
            background: #f0f6ff;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
            color: #1769d1;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">DS</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter the OTP sent to your email and create a new password.
    </p>

    <div class="email-info" id="emailInfo">
        OTP sent to your email
    </div>

    <form id="resetForm">

        <!-- OTP -->
        <label for="otp">
            Verification OTP
        </label>

        <input
            type="text"
            id="otp"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
        >

        <!-- NEW PASSWORD -->
        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <!-- CONFIRM PASSWORD -->
        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit" id="resetButton">
            Verify OTP & Update Password
        </button>

    </form>

    <div id="message"></div>

    <div class="back">
        <a href="login.html">Back to Login</a>
    </div>

</div>


<script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
        "https://nlzrdjvlkdqungmhnsrl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_ZJldk78Tl0wQW0r2k4Sakw_lYTXIET6";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const resetForm =
        document.getElementById("resetForm");

    const otpInput =
        document.getElementById("otp");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const message =
        document.getElementById("message");

    const resetButton =
        document.getElementById("resetButton");

    const emailInfo =
        document.getElementById("emailInfo");


    // ==========================================
    // GET EMAIL
    // ==========================================

    /*
        The login page should save the email
        before sending the reset OTP.

        Example:

        localStorage.setItem(
            "resetEmail",
            email
        );
    */

    const email =
        localStorage.getItem("resetEmail");


    if (!email) {

        message.style.color = "red";

        message.textContent =
            "Reset email information is missing. Please go back to Login and request a new password reset.";

        resetForm.classList.add("hidden");

    } else {

        emailInfo.textContent =
            "OTP sent to: " + email;

    }


    // ==========================================
    // OTP INPUT - NUMBERS ONLY
    // ==========================================

    otpInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value.replace(/\D/g, "");

        }
    );


    // ==========================================
    // RESET PASSWORD
    // ==========================================

    resetForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const otp =
                otpInput.value.trim();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            message.textContent = "";


            // ==================================
            // CHECK EMAIL
            // ==================================

            if (!email) {

                message.style.color = "red";

                message.textContent =
                    "Email information is missing.";

                return;
            }


            // ==================================
            // CHECK OTP
            // ==================================

            if (!/^\d{6}$/.test(otp)) {

                message.style.color = "red";

                message.textContent =
                    "Please enter the 6-digit OTP.";

                return;
            }


            // ==================================
            // CHECK PASSWORD
            // ==================================

            if (password.length < 8) {

                message.style.color = "red";

                message.textContent =
                    "Password must be at least 8 characters.";

                return;
            }


            // ==================================
            // CHECK PASSWORD MATCH
            // ==================================

            if (password !== confirmPassword) {

                message.style.color = "red";

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            // ==================================
            // DISABLE BUTTON
            // ==================================

            resetButton.disabled = true;

            resetButton.textContent =
                "Verifying OTP...";


            try {

                // ==================================
                // VERIFY OTP
                // ==================================

                const {
                    data,
                    error: otpError
                } = await supabaseClient.auth.verifyOtp({

                    email: email,

                    token: otp,

                    type: "recovery"

                });


                if (otpError) {

                    throw otpError;

                }


                // ==================================
                // OTP VERIFIED
                // ==================================

                resetButton.textContent =
                    "Updating Password...";


                // ==================================
                // UPDATE PASSWORD
                // ==================================

                const {
                    error: passwordError
                } =
                    await supabaseClient.auth.updateUser({

                        password: password

                    });


                if (passwordError) {

                    throw passwordError;

                }


                // ==================================
                // SUCCESS
                // ==================================

                message.style.color = "green";

                message.textContent =
                    "Password updated successfully! Redirecting to Login...";


                resetButton.textContent =
                    "Password Updated";


                // Remove stored reset email

                localStorage.removeItem(
                    "resetEmail"
                );


                // Sign out

                await supabaseClient.auth.signOut();


                // Redirect to login

                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1500);


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                message.style.color = "red";

                message.textContent =
                    error.message ||
                    "Invalid or expired OTP. Please request a new OTP.";


                resetButton.disabled = false;

                resetButton.textContent =
                    "Verify OTP & Update Password";

            }

        }
    );

</script>

</body>

</html>
